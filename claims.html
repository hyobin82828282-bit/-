<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월 클레임 관리</title>

<style>
:root{--bg:#EEF1F7;--surface:#FFFFFF;--surface2:#F5F7FB;--border:#DDE2ED;--text:#0F1624;--muted:#6B7689;--accent:#1A4ED8;--accent-hover:#1340BC;--success:#047857;--success-bg:#ECFDF5;--danger:#C62828;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.12);--radius:8px;--row-hover:#F0F4FF}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{font-family:'Noto Sans KR',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
.claims-workspace{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:1400px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.claims-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px}
.claims-head h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.claims-head p{font-size:12px;color:var(--muted);margin-top:2px}
.claims-actions,.claims-toolbar,.claims-queue-head>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover:not(:disabled){background:var(--border)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:default}
select,input{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px;outline:none;min-width:0}
select:focus,input:focus{border-color:var(--accent);background:var(--surface)}
.muted{color:var(--muted);font-size:12px}
.claims-cloud{display:grid;grid-template-columns:auto minmax(0,220px) minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 16px}
.claims-cloud small{grid-column:1/-1;color:var(--muted);font-size:11px}
.claims-cloud .muted{grid-column:1/-1}
@media(max-width:760px){.claims-cloud{grid-template-columns:1fr}}
.claims-toolbar{padding:10px 16px}
.claims-toolbar .muted{margin-left:auto}
.claims-queue{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.claims-queue-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-bottom:6px}
.claims-queue-head b{font-size:14px}
.queue-row{display:grid;grid-template-columns:minmax(0,1fr) auto 120px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}
.queue-row span{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fare-draft{text-align:right;font-variant-numeric:tabular-nums}
.fare-draft.filled{border-color:var(--success);background:var(--success-bg)}
@media(max-width:640px){.queue-row{grid-template-columns:1fr 1fr}.queue-row span{grid-column:1/-1}}
.claims-table-wrap{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--surface2);border-bottom:2px solid var(--border);padding:7px 8px;text-align:left;white-space:nowrap;font-weight:600;font-size:11px;color:var(--muted);z-index:2}
tbody td{padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:var(--row-hover)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td input{height:28px;width:100%;min-width:120px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:420px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:10px}
.modal-title{font-size:15px;font-weight:700}
.modal-body{font-size:12px;color:var(--muted)}
.claims-choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.claims-choice:has(input:checked){border-color:var(--accent);background:#EEF3FF}
.claims-choice input{height:auto;margin-top:3px}
.claims-choice span{display:flex;flex-direction:column}
.claims-choice small{color:var(--muted);font-size:11px}
.claims-start{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:500}
.claims-start input{width:100px;text-align:right}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#flash{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F1624;color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;box-shadow:var(--shadow-md);z-index:400;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.on{opacity:1}
</style>

}

function buildQueue() {
  const wb = S.wb, s = sh(), { waybillCol, mallCol } = cols();
  if (!wb || !s) return;
  const seen = new Set(), out = [];
  for (let r = 2; r < Math.max(2, S.start); r++) { const p = norm(wb.value(s, col(waybillCol) + r)); if (p) seen.add(p); }
  for (let r = Math.max(2, S.start); r <= s.maxR; r++) {
    const waybill = norm(wb.value(s, col(waybillCol) + r));
    if (!waybill) break;
    const mall = norm(claimValue(wb, s, col(mallCol) + r));
    if (seen.has(waybill)) continue;
    seen.add(waybill);
    if (S.mode === 'only' && mall !== '도착보장') continue;
    if (S.mode === 'exclude' && mall === '도착보장') continue;
    if (!norm(wb.value(s, col(FARE_COL) + r))) out.push({ row: r, mall, waybill });
  }
  set({ queue: out, settingsOpen: false });
  flash('조회 목록 ' + out.length + '건을 만들었습니다.');
}
function autoLookup() {
  if (!S.queue.length || S.autoBusy) return;
  let cj = cjWindow;
  if (!cj || cj.closed) {
    cj = window.open('', 'cjFreightLookup');
    if (cj) { try { if (cj.location.href === 'about:blank') cj.location.href = CJ_URL; } catch {} }
  }
  if (!cj) { flash('팝업이 차단됐습니다. CJ 사이트 팝업을 허용해 주세요.'); return; }
  cjWindow = cj;
  const jobId = crypto.randomUUID(); autoJob = jobId;
  const waybills = S.queue.map(x => x.waybill.replace(/\D/g, ''));
  const send = () => cj.postMessage({ source: 'claims-app', type: 'lookup', jobId, waybills }, CJ_ORIGIN);
  set({ autoBusy: true, autoProgress: 'CJ 화면 연결 중…' }); send();
  clearInterval(autoPoll); autoPoll = setInterval(send, 500);
  autoTimeout = setTimeout(() => {
    clearInterval(autoPoll); set({ autoBusy: false, autoProgress: '' });
    flash('CJ 자동조회 보조도구가 연결되지 않았습니다. 설치 후 다시 실행해 주세요.');
  }, 20000);
}
window.addEventListener('message', event => {
  if (event.data?.type === 'ms-code' && event.origin === location.origin) {
    exchangeCode(S.clientId, event.data.code, event.data.state).then(openCloudFile)
      .catch(err => flash('OneDrive 연결 실패: ' + err.message)).finally(() => set({ cloudBusy: false }));
    return;
  }
  if (event.origin !== CJ_ORIGIN || event.source !== cjWindow || event.data?.source !== 'cj-freight-extension' || event.data.jobId !== autoJob) return;
  const d = event.data;
  if (d.type === 'started') { clearInterval(autoPoll); clearTimeout(autoTimeout); set({ autoProgress: 'CJ 조회 진행 중…' }); return; }
  if (d.type === 'progress') {
    const row = S.queue.find(x => x.waybill.replace(/\D/g, '') === d.result.waybill);
    if (row && d.result.amount) S.fareDrafts = { ...S.fareDrafts, [row.row]: String(d.result.amount) };
    set({ autoProgress: `${d.done}/${d.total}건 조회` }); return;
  }
  if (d.type === 'done') {
    clearInterval(autoPoll); clearTimeout(autoTimeout);
    set({ autoBusy: false, autoProgress: '' });
    const found = d.results.filter(x => x.amount).length;
    flash(`CJ 운임 조회 완료 · ${found}건 금액 확인 · ${d.results.length - found}건 결과 없음`);

});

    for (const { row, amount } of pending) {
      if (S.cloudFile) await writeRange(S.cloudFile, S.sheetName, 'X' + row.row, [[amount]]);
      wb.setCell(S.sheetName, 'X' + row.row, amount);
    }
    const saved = new Set(pending.map(x => x.row.row));
    S.queue = S.queue.filter(x => !saved.has(x.row));
    S.fareDrafts = Object.fromEntries(Object.entries(S.fareDrafts).filter(([r]) => !saved.has(Number(r))));
    flash(`${pending.length}건 운임을 저장했습니다.`);
  } catch (err) { flash('일괄 저장 실패: ' + err.message); }
  finally { set({ busy: false }); }
}
async function syncCloudCell(row, address, value) {
  if (!S.cloudFile) return;
  const { waybillCol } = cols();
  const remote = await sheetRange(S.cloudFile, S.sheetName, 'E' + row + ':E' + row);
  const target = await sheetRange(S.cloudFile, S.sheetName, address + ':' + address);
  if (norm(target.formulas?.[0]?.[0]).startsWith('=')) throw new Error('OneDrive 대상 셀에 수식이 있어 수정하지 않았습니다.');
  if (norm(remote.values?.[0]?.[0]).replace(/\D/g, '') !== norm(S.wb.value(sh(), col(waybillCol) + row)).replace(/\D/g, '')) throw new Error('OneDrive 송장번호가 달라 저장을 멈췄습니다.');
  await writeRange(S.cloudFile, S.sheetName, address, [[value]]);
}
async function saveNote(row, value) {
  const wb = S.wb, s = sh(), { noteCol } = cols();
  if (wb && s && noteCol) {
    const cell = s.cells[col(noteCol) + row];
    if (cell?.f && !cell.fAdded) { flash('수식 셀은 메모로 덮어쓰지 않았습니다.'); return; }
    try { await syncCloudCell(row, col(noteCol) + row, value); wb.setCell(S.sheetName, col(noteCol) + row, value); } catch (err) { flash('OneDrive 메모 저장 실패: ' + err.message); }
  } else {
    const memos = JSON.parse(localStorage.getItem('claims-notes:' + S.name) || '{}');
    memos[refNoteKey(S.cloudFile, S.sheetName, row)] = value; localStorage.setItem('claims-notes:' + S.name, JSON.stringify(memos));
  }
}
async function saveCoolant(row, value) {
  const wb = S.wb, s = sh(), { coolantCol } = cols();
  if (!wb || !s || !coolantCol) return;
  const ref = col(coolantCol) + row, cell = s.cells[ref];
  if (cell?.f && !cell.fAdded) return;
  try { await syncCloudCell(row, ref, value); wb.setCell(S.sheetName, ref, value); } catch (err) { flash('OneDrive 냉매 저장 실패: ' + err.message); }
}
async function importIntegrated(f) {
  const wb = S.wb;
  if (!f || !wb || !sh()) return;
  set({ busy: true });
  try {
    const src = Engine.load(new Uint8Array(await f.arrayBuffer()));
    const srcSheet = src.byName['통합내역'] || src.sheets.find(s => s.name.includes('통합내역'));
    const dstSheet = wb.byName['통합내역'];
    if (!srcSheet || !dstSheet) throw new Error('가져올 파일과 관리 파일에 모두 ‘통합내역’ 시트가 있어야 합니다.');
    const KEY = [5, 7, 8, 9, 13, 15], existing = new Set(), byWaybillProduct = new Map();
    for (let r = 2; r <= dstSheet.maxR; r++) {
      const vals = KEY.map(c => norm(wb.value(dstSheet, col(c) + r)));
      if (vals.some(Boolean)) existing.add(vals.join('|'));
      const identity = [5, 7].map(c => norm(wb.value(dstSheet, col(c) + r))).join('|');
      if (identity !== '|') byWaybillProduct.set(identity, [...(byWaybillProduct.get(identity) || []), r]);
    }
    let added = 0, updated = 0, changedCells = 0, last = dstSheet.maxR; const addedRows = [], changedRows = [];
    const width = () => Math.max(srcSheet.maxC, dstSheet.maxC);
    for (let r = 2; r <= srcSheet.maxR; r++) {
      if (!norm(src.value(srcSheet, 'E' + r))) continue;
      const key = KEY.map(c => norm(src.value(srcSheet, col(c) + r))).join('|');
      if (existing.has(key)) continue;
      const identity = [5, 7].map(c => norm(src.value(srcSheet, col(c) + r))).join('|');
      const candidates = (byWaybillProduct.get(identity) || []).filter(row => !changedRows.includes(row));
      if (identity !== '|' && candidates.length === 1) {
        const priorRow = candidates[0]; let changed = false;
        for (let c = 1; c <= width(); c++) {
          const address = col(c) + r, dest = col(c) + priorRow, sourceCell = srcSheet.cells[address], prior = dstSheet.cells[dest];
          if (sourceCell?.f || (prior?.f && !prior.fAdded)) continue;
          const value = src.value(srcSheet, address);
          const next = value === null ? '' : typeof value === 'object' ? String(value.err) : value;
          if (norm(wb.value(dstSheet, dest)) === norm(next)) continue;
          wb.setCell(dstSheet.name, dest, next, false); changed = true; changedCells++;
        }
        if (changed) { updated++; changedRows.push(priorRow); }
        existing.add(key); continue;
      }
      const next = ++last;
      for (let c = 1; c <= width(); c++) {
        const address = col(c) + r, sourceCell = srcSheet.cells[address], prior = dstSheet.cells[col(c) + (next - 1)];
        if (prior?.f) setFormula(wb, dstSheet.name, col(c) + next, Engine.shiftFormula(prior.f.replace(/^=/, ''), 0, 1));
        else if (sourceCell?.f) { /* 원본 수식은 누적 시트에 넣지 않음 */ }
        else { const value = src.value(srcSheet, address); if (value !== null && value !== '' && typeof value !== 'object') wb.setCell(dstSheet.name, col(c) + next, value, false); }
      }
      existing.add(key); added++; addedRows.push(next);
    }
    if (S.cloudFile && (addedRows.length || changedRows.length)) {
      for (const row of [...addedRows, ...changedRows]) {
        const remote = await sheetRange(S.cloudFile, dstSheet.name, 'E' + row + ':E' + row);
        if (addedRows.includes(row) && norm(remote.values?.[0]?.[0])) throw new Error('OneDrive의 같은 행에 이미 송장번호가 있어 중복 저장을 멈췄습니다.');
        if (changedRows.includes(row) && norm(remote.values?.[0]?.[0]) !== norm(wb.value(dstSheet, 'E' + row))) throw new Error('OneDrive의 기존 송장번호가 달라 수정 저장을 멈췄습니다.');
        const w = width(), values = [[]], formulas = [[]];
        for (let c = 1; c <= w; c++) {
          const ref = col(c) + row, cell = dstSheet.cells[ref], formula = cell?.f ? (cell.f.startsWith('=') ? cell.f : '=' + cell.f) : null;
          formulas[0].push(formula);
          const value = wb.value(dstSheet, ref);
          values[0].push(formula ? null : (value === null || typeof value !== 'object' ? value : String(value.err)));
        }
        await writeRange(S.cloudFile, dstSheet.name, 'A' + row + ':' + col(w) + row, values, formulas);
      }
    }
    flash(`통합내역 신규 ${added}행 추가 · 기존 ${updated}행에서 ${changedCells}개 변경값만 반영했습니다.`);
  } catch (err) { flash('통합내역 가져오기 실패: ' + err.message); }
  finally { set({ busy: false }); }
}
async function exportFile() {
  if (!S.wb) return;
  const fname = S.name.replace(/\.xlsx$/i, '') + '-수정.xlsx', blob = S.wb.exportBlob();
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: fname, types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    flash('수정한 엑셀을 내보냈습니다.');
  } catch (e) {
    if (e.name === 'AbortError') { flash('내보내기를 취소했습니다.'); return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click(); flash('수정한 엑셀을 내보냈습니다.'); }
    catch { flash('이 화면에서 파일을 저장할 수 없습니다.'); }
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const row = Number(b.dataset.row);
  ({
    open: () => $('#fileIn').click(), import: () => $('#importIn').click(), export: exportFile, cloud: connectCloud,
    settings: () => set({ settingsOpen: true }), closeSettings: () => set({ settingsOpen: false }), build: buildQueue,
    auto: autoLookup, saveAll: saveAllFares, skip: () => set({ queue: S.queue.filter(x => x.row !== row) }),
    cj: () => {
      const r = S.queue.find(x => x.row === row);
      navigator.clipboard?.writeText(r.waybill).catch(() => {});
      cjWindow = window.open(CJ_URL, 'cjFreightLookup');
      flash('송장번호를 복사했습니다. 열린 CJ 화면에서 조회 후 운임을 입력해 주세요.');
    },
  })[b.dataset.a]?.();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.fare) {
    t.value = t.value.replace(/[^0-9]/g, '');
    S.fareDrafts = { ...S.fareDrafts, [t.dataset.fare]: t.value };
    t.classList.toggle('filled', !!t.value);
    const sa = $('#saveAll'); if (sa) sa.disabled = S.busy || !Object.values(S.fareDrafts).some(v => Number(v) > 0);
  } else if (t.id === 'clientId' || t.id === 'shareUrl') {
    S[t.id] = t.value;
    const cb = document.querySelector('[data-a="cloud"]'); if (cb) cb.disabled = S.cloudBusy || !S.clientId || !S.shareUrl;
  } else if (t.id === 'startIn') S.start = Math.max(2, Number(t.value) || 2);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sheetSel') set({ sheetName: t.value });
  else if (t.name === 'freight-mode') set({ mode: t.value });
  else if (t.id === 'fileIn' || t.id === 'importIn') { const f = t.files?.[0]; t.value = ''; if (f) (t.id === 'fileIn' ? openFile : importIntegrated)(f); }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset.note) saveNote(Number(t.dataset.note), t.value);
  else if (t.dataset.coolant) saveCoolant(Number(t.dataset.coolant), t.value);
});

// ---------- boot ----------
const q = new URLSearchParams(location.search);
if (q.has('code') && window.opener && window.opener !== window) {
  try { window.opener.postMessage({ type: 'ms-code', code: q.get('code'), state: q.get('state') }, location.origin); } catch {}
  document.body.textContent = '로그인 완료. 이 창은 닫아도 됩니다.'; setTimeout(() => window.close(), 400);
  return;
}
render();
if (q.has('code') && S.clientId && S.shareUrl) {
  set({ cloudBusy: true });
  finishMicrosoftSignIn(S.clientId).then(done => done ? openCloudFile() : null)
    .catch(err => flash('OneDrive 연결 실패: ' + err.message)).finally(() => set({ cloudBusy: false }));
}
})();
</script>
